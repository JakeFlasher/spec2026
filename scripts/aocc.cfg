#-------------------------------------------------------------------------------
# SPEC CPU(R) 2026 config for AMD Optimizing C/C++ Compiler (AOCC) on Linux x86_64
#-------------------------------------------------------------------------------
#
# Usage: (1) Copy this to a new name
#             cd $SPEC/config
#             cp Example-x.cfg myname.cfg
#        (2) Change items that are marked 'EDIT' (search for it)
#
# SPEC tested this config file with:
#    Compiler version(s):    AOCC 5.1.0
#    Operating system(s):    Linux (Ubuntu 24.04)
#    Hardware:               x86 (EPYC)
#
# If your system differs, this config file might not work.
# You might find a better config file at https://www.spec.org/cpu2026/results
#
# Compiler notes
#
#   AMD Optimizing C/C++ and Fortran Compilers (AOCC) can be downloaded at
#   https://www.amd.com/en/developer/aocc.html - Please follow the
#   README (Also available at the same location) for instllation guidance
#
# Unexpected errors?  Try using a newer version of the compiler
#                     or try reducing the optimization level
#
# Compiler issues: Contact your compiler vendor, not SPEC.
# For SPEC help:   https://www.spec.org/cpu2026/Docs/techsupport.html
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
# Arbitrary alphanumeric string to tag binaries and directories.
# More info: https://www.spec.org/cpu2026/Docs/config.html#label
# Two suggestions:
#                 (1) EDIT the label as you try new ideas.
#                 (2)      Use a label meaningful to *you*.
%ifndef %{label}
   label   = mytest_aocc # EDIT
%else
   label   = %{label}
%endif


#--------- Preprocessor -------------------------------------------------------
%ifndef %{aocc_version}        # EDIT to select the version of AOCC to use.  Or,
%   define aocc_version 5.2.0  #      you can set it on the command line using:
%endif                         #      'runcpu --define aocc_version=x.y.z'

%ifndef %{build_ncpus}         # EDIT to adjust number of simultaneous compiles.
%   define  build_ncpus 8      #      Or, you can set it on the command line:
%endif                         #      'runcpu --define build_ncpus=nn'

# AOCC 5.2.0 is Clang 17.0.6, which cannot parse libstdc++ headers from
# GCC >= 16 (hidden-friend operator- with decltype return in __normal_iterator
# triggers "member access into incomplete type"). Pin clang's GCC installation
# to the gcc-15 tree, matching the project toolchain baseline.
%ifndef %{gcc_install_dir}
%   define gcc_install_dir /usr/lib64/gcc/x86_64-pc-linux-gnu/15.2.1
%endif


#--------- Global Settings ----------------------------------------------------
# For info, see:
#            https://www.spec.org/cpu2026/Docs/config.html#fieldname
#   Example: https://www.spec.org/cpu2026/Docs/config.html#tune

default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/aocc.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
# Both SPECrate and SPECspeed can test multiple chips / cores / hw threads
#    - For SPECrate,  you set the number of copies.
#    - For SPECspeed, you set the number of threads.
# See: https://www.spec.org/cpu2026/Docs/system-requirements.html#MultipleCPUs
#
#    q. How many should I set?
#    a. Unknown, you will have to try it and see!
#
# To get you started, some suggestions:
#
#     copies - This config file defaults to testing only 1 copy.   You might
#              try changing it to match the number of cores on your system,
#              or perhaps the number of virtual CPUs as reported by:
#                     grep -c processor /proc/cpuinfo
#              Be sure you have enough memory.  See:
#              https://www.spec.org/cpu2026/Docs/system-requirements.html#memory
#
#     threads - This config file sets a starting point, which you can adjust.
#               A higher thread count is much more likely to be useful for
#               fpspeed than for intspeed.
#
default:
   copies                 = 1       # EDIT to change number of copies (see above)
   threads                = 4       # EDIT to change number of OpenMP threads (see above)


#------- Compilers ------------------------------------------------------------
default:
#  EDIT: The parent directory for your compiler.
#        Do not include the trailing /bin/
#        Do not include a trailing slash
#  Examples:
#   1  On an Ubuntu system, you said
#      'dpkg -i aocc-compiler-2.0.0_1_amd64.deb'
#      Use:                 %   define aocc_dir "/opt/AMD/aocc-compiler-%{aocc_version}"
#   2  You unpacked AOCC-1.3.0-Compiler.tar into /data1/aocc/AOCC-1.3.0-Compiler/
#      Use:                 %   define aocc_dir "/data1/aocc/AOCC-1.3.0-Compiler"
#
%ifndef %{aocc_dir}
%   define  aocc_dir        "/opt/aocc" # EDIT (see above)
%endif

# EDIT if needed: the preENV line adds library directories to the runtime
#      path.  You can adjust it, or add lines for other environment variables.
#      See: https://www.spec.org/cpu2026/Docs/config.html#preenv
   preENV_LD_LIBRARY_PATH  = %{aocc_dir}/lib:/lib64:%{ENV_LD_LIBRARY_PATH}
   SPECLANG                = %{aocc_dir}/bin/
   CC                      = $(SPECLANG)clang    -std=c18    -m64 --gcc-install-dir=%{gcc_install_dir}
   CXX                     = $(SPECLANG)clang++  -std=c++17  -m64 --gcc-install-dir=%{gcc_install_dir}
   FC                      = $(SPECLANG)flang    -std=f2018  -m64
   # How to say "Show me your version, please"
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version


#--------- Portability --------------------------------------------------------

800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

834.vpr_s:
   PORTABILITY = -fno-finite-math-only

835.gem5_s:
   PORTABILITY = -fno-finite-math-only

853.ns3_s:
   PORTABILITY = -fno-finite-math-only

867.nest_s:
   PORTABILITY = -fno-finite-math-only


#-------- Tuning Flags common to Base and Peak --------------------------------
#
# Speed (OpenMP and Autopar allowed)
#
intspeed,fpspeed:
    preENV_OMP_STACKSIZE = 120M
openmp,doconcurrent:
   EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread


#--------  Base Tuning Flags ----------------------------------------------
# EDIT if needed -- If you run into errors, you may need to reduce the
#                   optimization.
#
default=base:       # flags for all base
   # Explicit -march: project rules forbid -march=native; this host is Zen 5
   # (Ryzen 9 9955HX), confirmed via 'clang -march=native' -> znver5.
   COPTIMIZE      = -g -O3 -march=znver5
   CXXOPTIMIZE    = -g -O3 -march=znver5
   FOPTIMIZE      = -g -O3 -march=znver5

intspeed,fpspeed:
   OPTIMIZE       = -ffast-math


#--------  Peak Tuning Flags ----------------------------------------------
default:           # If you develop some peak tuning, remove these two lines
   basepeak = yes  # and put your tuning in the default=peak: section below.
default=peak:


#------------------------------------------------------------------------------
# Tester and System Descriptions - EDIT all sections below this point
#------------------------------------------------------------------------------
#   For info about any field, see
#             https://www.spec.org/cpu2026/Docs/config.html#fieldname
#   Example:  https://www.spec.org/cpu2026/Docs/config.html#hw_memory
#-------------------------------------------------------------------------------

#--------- EDIT to match your version -----------------------------------------
default:
   sw_compiler001   = C/C++/Fortran: Version %{aocc_version} of AOCC, the
   sw_compiler002   = AMD Optimizing C/C++ and Fortran Compiler
   sw_compiler_category = Vendor
   sw_base_ptrsize  = 64-bit
   sw_peak_ptrsize  = Not Applicable

#--------- EDIT info about you ------------------------------------------------
# To understand the difference between hw_vendor/sponsor/tester, see:
#     https://www.spec.org/cpu2026/Docs/config.html#test_sponsor
default:
   hw_vendor          = My Corporation
   tester             = My Corporation
   test_sponsor       = My Corporation
   license_num        = nnn (Your SPEC license number)
#  prepared_by        = # Ima Pseudonym                       # Whatever you like: is never output


#--------- EDIT system availability dates -------------------------------------
default:
                        # Example                             # Brief info about field
   hw_avail           = # Nov-2099                            # Date of LAST hardware component to ship
   sw_avail           = # Nov-2099                            # Date of LAST software component to ship
   fw_bios            = # Version Mumble released May-2099    # Firmware information

#--------- EDIT system information --------------------------------------------
default:
                        # Example                             # Brief info about field
   hw_cpu_name        = # AMD EPYC 999                        # chip name
   hw_cpu_nominal_mhz = # 9999                                # Nominal chip frequency, in MHz
   hw_cpu_max_mhz     = # 9999                                # Max chip frequency, in MHz
   hw_storage         = # 9 x 9 TB NVMe SSD                   # Size, type, other perf-relevant info
   hw_model           = # TurboBlaster 9000                   # system model name
   hw_nchips          = # 99                                  # number chips enabled
   hw_ncores          = # 9999                                # number cores enabled
   hw_ncpuorder       = # 1-9 chips                           # Ordering options
   hw_nthreadspercore = # 9                                   # number threads enabled per core
   hw_cooling         = Air                                   # Air, CLC, DLC, or Other
   hw_other           = # TurboNUMA Router 10 Gb              # Other perf-relevant hw, or "None"

   hw_memory001       = # 999 GB (99 x 9 GB 2Rx4 PC4-2133P-R, # The 'PCn-etc' is from the JEDEC
   hw_memory002       = # running at 1600 MHz)                # label on the DIMM.

   hw_pcache          = # 99 KB I + 99 KB D on chip per core  # Primary cache size, type, location
   hw_scache          = # 99 KB I+D on chip per 9 cores       # Second cache or "None"
   hw_tcache          = # 9 MB I+D on chip per chip           # Third  cache or "None"
   hw_ocache          = # 9 GB I+D off chip per system board  # Other cache or "None"

   sw_file            = # ext99                               # File system
   sw_os001           = # Linux Sailboat                      # Operating system
   sw_os002           = # Distribution 7.2 SP1                # and version
   sw_other           = # TurboHeap Library V8.1              # Other perf-relevant sw, or "None"
   sw_state           = # Run level 99                        # Software state.

   power_management   = # briefly summarize power settings

